[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pcfind"
version = "0.1.0"
description = "Search a whole machine for a string or filename without silently skipping gitignored notes, and without paying antivirus per-open costs on files that cannot match."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dorddis" }]
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
keywords = ["ripgrep", "search", "grep", "windows", "everything", "ai-agents"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]
benchmark = ["pyyaml>=6"]

[project.scripts]
pcfind = "pcfind.cli:main"

[project.urls]
Repository = "https://github.com/dorddis/pcfind"

[tool.hatch.build.targets.wheel]
packages = ["src/pcfind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
